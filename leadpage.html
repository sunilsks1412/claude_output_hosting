<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Started - Lead Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: Poppins, sans-serif;
      background-color: #fafafa;
      margin: 0;
    }

    /* ===== Header component styles ===== */
    .quantity-circle {
      margin-right: 9%;
      margin-top: 1%;
      position: absolute;
      top: unset;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      padding: 8px;
      border: 2px solid #666;
      color: #666;
      text-align: center;
      font: 10px Arial, sans-serif;
      right: unset;
    }

    .image-quantity-container {
      margin: 0 auto;
      width: 100px;
      height: auto;
      position: relative;
    }

    .image-cart-header {
      width: 300px;
      height: 56px;
      float: left;
      margin-left: 10%;
      max-height: 100px;
    }

    .cc-cv-canvas__tools > #cc-tools > .cc-toolbar > div > .fa-trash-o {
      pointer-events: none;
    }

    .rightPanelHTML {
      display: none;
    }

    .fk-parent-cart-element {
      display: inline-block;
      float: right;
      margin-right: 10%;
    }

    .panelCartCircle {
      position: absolute;
      margin: 0%;
      margin-left: -6px;
      top: unset;
      right: unset;
    }

    .fk-shopping-cart-icon {
      font-size: 32px;
      margin-top: 15px;
      cursor: pointer;
    }

    .cartPanelHeader {
      padding: 0.5rem;
      min-height: 80px;
      background-color: #fff;
      overflow: visible;
    }

    .fk-inner-header-wrapper {
      display: flex;
      flex-direction: row;
      margin: 0 10%;
      justify-content: space-between;
    }

    .fk-brand-wrapper {
      display: flex;
      flex-direction: row;
    }

    .fk-brand,
    .fk-cart-icon-container {
      margin: 0;
    }

    .fk-menu-container {
      padding: 5px;
      display: flex;
      flex-direction: row;
      align-self: center;
      flex-wrap: wrap;
      margin-right: auto;
    }

    .fk-inner-header-wrapper .fk-menu-container .fk-menu {
      padding: 5px;
      white-space: nowrap;
      color: black;
    }

    .fk-inner-header-wrapper .fk-menu-container .fk-menu:hover,
    .fk-inner-header-wrapper .fk-menu-container .fk-menu:focus {
      color: black;
    }

    .fk-menu-btn-container {
      display: none;
      padding: 5px;
    }

    .fk-menu-btn {
      background-color: transparent;
      border: none;
      cursor: pointer;
      color: black;
      font-size: 25px;
      padding: 5px 8px;
    }

    .fk-menu-btn,
    .fk-menu-btn:focus {
      outline: none;
    }

    .fk-cart-container {
      padding: 5px;
      position: relative;
    }

    .fk-cart-wrapper {
      display: flex;
      flex-direction: row;
      padding: 5px;
    }

    .sidepanel .cc-panel-view-cart,
    .sidepanel .cc-panel-checkout {
      font-size: 16px;
      padding: 5px 0;
      margin: 0px auto;
    }

    @media (max-width: 480px) {
      .image-quantity-container {
        margin: 0 auto;
        width: 55px;
        position: relative;
      }

      .image-cart-header {
        margin-left: 5%;
        width: 150px;
        height: 28px;
        margin-top: 3%;
      }

      .quantity-circle {
        position: absolute;
        top: unset;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        padding: 5px;
        border: 2px solid #666;
        color: #666;
        text-align: center;
        font: 8px Arial, sans-serif;
        right: unset;
      }
    }

    @media (max-width: 768px) {
      .fk-menu-btn-container {
        display: flex;
        align-self: center;
      }

      .fk-menu-container {
        display: none;
      }

      .cartPanelHeader {
        height: 70px;
      }

      .fk-shopping-cart-icon {
        font-size: 25px;
      }

      .fk-inner-header-wrapper {
        margin-left: 3%;
        margin-right: 8%;
      }
    }

    @media (max-width: 480px) {
      .fk-shopping-cart-icon {
        font-size: 20px;
      }

      .cartPanelHeader {
        height: 60px;
      }

      .panelCartCircle {
        position: absolute;
        margin: 0%;
        margin-left: -6px;
        top: unset;
        right: unset;
      }
    }

    /* ===== Lead - vertical label component styles ===== */
    .form-style {
      width: auto;
      border: 1px solid #f4f4f4;
    }

    .btn {
      display: inline-block;
      font-weight: 400;
      text-align: center;
      white-space: normal;
      vertical-align: middle;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      border: 1px solid transparent;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 25px;
      padding-right: 25px;
      line-height: 1.5;
      border-radius: 0.25rem;
      transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out,
        border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      margin: 20px auto;
      white-space: normal;
      font-size: 20px;
    }

    .btn-primary {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
      white-space: normal;
    }

    .form-control-custom {
      display: block;
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      line-height: 1.5;
      color: #495057;
      background-color: #fff;
      background-clip: padding-box;
      border: 1px solid #ced4da;
      border-radius: 0.25rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .form-group-div {
      margin: 10px 0px;
      width: 100%;
      padding: 0px 15px;
    }

    .row-wrap {
      display: flex;
      flex-wrap: wrap;
      width: auto;
    }

    .cc-v2 {
      border-radius: 6px;
      background: #f4f4f4ff;
      padding: 20px 10px 10px 10px;
      font-family: Poppins;
      font-weight: 400;
    }

    .cc-v2 label {
      font-family: Poppins;
      font-weight: 400;
      width: fit-content;
    }

    .cc-form-control-custom {
      font-family: poppins;
      font-weight: 400;
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(73, 80, 87, 1);
      background-color: rgba(255, 255, 255, 1);
      background-clip: padding-box;
      border: 1px solid rgba(206, 212, 218, 1);
      border-radius: 0.25rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .cc-v2 .btn.btn-primary.cc-form-btn {
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 25px;
      padding-right: 25px;
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: 20px;
      background: #f26419ff;
      border-color: #f26419ff;
    }

    .cc-v2 .btn.btn-primary.cc-form-btn:hover {
      background: #f26419ff;
      border-color: #f26419ff;
    }

    .cc-container-100 div {
      text-align: left;
      padding: 0px;
    }

    .form-control-custom:focus,
    input:not([type="radio"]):focus,
    select:focus {
      border: solid 1px rgba(242, 100, 25, 1);
      border-radius: 6px;
      outline: none !important;
      box-shadow: none;
    }

    /* ===== Page layout styles ===== */
    .cc-lead-page-wrapper {
      max-width: 720px;
      margin: 40px auto 60px auto;
      padding: 0 15px;
    }

    .cc-v2 h1 {
      font-size: 26px;
      text-align: center;
      margin-bottom: 10px;
      color: #2b2b2b;
    }

    .cc-lead-intro {
      text-align: center;
      color: #6c6c6c;
      margin-bottom: 25px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <!-- ===== Header component ===== -->
  <header class="cartPanelHeader" id="cc-id-NbrnTP3fAbnF">
    <div class="fk-inner-header-wrapper" id="cc-id-bmOHnKYaXRvj">
      <div class="fk-brand-wrapper" id="cc-id-7uff0LYTH8xI">
        <div class="fk-menu-btn-container" id="cc-id-ZM1JRcoreogr">
          <span class="fk-menu-btn" id="cc-id-Nwwmq6OLkTkx" onclick="toggleSideMenuItems(event)" title=""
            target="_self" action="choose" align="center" animate="" speed="" delay="none" loop="none"
            variantvalue="" data-secondsdelay="" data-minutesdelay="" replaceproductid="" billnow="false" offer=""
            upsell="" quantity="" price="">
            <i class="fa fa-bars"></i>
          </span>
        </div>
        <img id="img1" class="image-quantity-container image-cart-header fk-logo fk-brand"
          src="https://templates.checkoutchamp.com/31a26ade-35f0-4c43-9b98-f730d58ad1c1/logo.png" title="" href=""
          onclick="" target="_self" alt="" align="center" width="150" height="50" />
      </div>
      <div class="fk-menu-container" id="cc-id-9NIQ0Wobtqn6">
        <div class="fk-menu" id="cc-id-2tOy4CqpIqK3" data-selector="true">
          Menu Option
        </div>
      </div>
      <div class="fk-cart-wrapper" id="cc-id-yn9FfcgMXAdx">
        <div class="fk-cart-container" id="cc-id-9G81aSQHqNgA">
          <span class="fk-parent-cart-element fk-cart-icon-container" id="panelCartBubbleWrapper">
            <i class="cc-pn-btn fa fa-shopping-cart fk-shopping-cart-icon" id="cc-id-C72qFl41sNLj"
              onclick="openNav()"></i>
            <span id="panelCartCircle" class="quantity-circle panelCartCircle">0</span>
          </span>
        </div>
      </div>
    </div>
    <div class="rightPanelHTML" id="rightPanelHTML">
      <div id="mySidepanel" class="sidepanel cc-custom-right-panel"
        style="border-color: lightgrey; width: 320px; max-width: 320px; border-style: solid; border-width: thin; min-height: 10%; visibility: hidden; position: fixed; height: 100vh; top: 0px; right: 0px; background-color: white; z-index: 999999;">
        <div class="sticky" id="cc-id-VHWGaub52Ztd" style="padding:1%;overflow:hidden">
          <h2 id="cc-id-26fEeVVhDIq2" style="margin-left:2%">
            Your Cart<span> </span><span class="close-panel" id="cc-id-AnHTmt9OBGhn" onclick="closeNav()" title="×"
              target="_self" action="choose" align="center" animate="" speed="" delay="none" loop="none"
              variantvalue="" data-secondsdelay="" data-minutesdelay="" replaceproductid="" billnow="false" offer=""
              upsell="" quantity="" price="">×</span>
          </h2>
        </div>
        <div id="cartPanelId" class="sticky" style="padding:1%;overflow:hidden"></div>
        <h5 id="cc-id-uKoneNo41eoP" style="margin-left:2%">
          Subtotal:
          <span class="cartPanelSubtotalClass" id="cc-id-ni6JDWYlgAAC">0</span>
        </h5>
        <br />
        <p id="cc-id-TP9gyv1plBAr" style="margin-left:2%">
          Taxes, shipping, and coupons will be calculated at checkout
        </p>
        <button style="margin-left:12%;width:224px;" class="btn btn-primary cc-panel-view-cart fk-cc-id-WHREorRtUOyL"
          action="route" onclick="route(event)" title="" align="center" btntype="none" data-secondsdelay=""
          data-minutesdelay="" type="button" variantvalue="" replaceproductid="" size="none" billnow="false" offer=""
          upsell="" quantity="" price="">
          VIEW CART</button><br /><br />
        <button style="margin-left:12%;width:224px;"
          class="btn btn-danger panel-checkout cc-panel-checkout fk-cc-id-KEq36y6OVM6F" action="route"
          onclick="route(event)" title="" align="center" btntype="none" data-secondsdelay="" data-minutesdelay=""
          type="button" variantvalue="" replaceproductid="" size="none" billnow="false" offer="" upsell=""
          quantity="" price="">
          PROCEED TO CHECKOUT
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Lead page content ===== -->
  <div class="cc-lead-page-wrapper" id="cc-id-p5B1Id9Z850k">
    <p class="cc-lead-intro" id="cc-id-Enydx9qWCA79">
      Fill out the form below and we'll get in touch with everything you need to get started.
    </p>

    <!-- ===== Lead - vertical label component ===== -->
    <form class="form form-style cc-v2 cc-cl-lead-vertical-label" id="cc-id-ISjs8JHUdKF0">
      <h1>Signup for more information</h1>
      <div class="row-wrap fk-element-container cc-container-100" id="cc-id-j7elKPoh3pKM">
        <div class="form-group-div fk-element-container" id="cc-id-zKG5mSoyPstU">
          <label class="label-name" id="cc-id-eC99enq522wj">First name</label>
          <input type="text" class="form-control-custom" id="cc-id-ZRL9OaYsP6ih" name="firstName" customval=""
            placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-gIqLSmNqE40f">
          <label class="label-name" id="cc-id-AraVNqTIAae2">Last Name</label>
          <input type="text" class="form-control-custom" id="cc-id-4HZKjht3X13n" name="lastName" customval=""
            placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-pgW2zMj518Y2">
          <label class="label-name" id="cc-id-bTu5X1YqWg21">Email Address</label>
          <input type="text" class="form-control-custom" id="cc-id-nYCsXoblu17r" name="emailAddress" customval=""
            placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-Ny8H6h8l7qgA">
          <label class="label-name" id="cc-id-TtLFxJpRa5HS">Phone Number</label>
          <input type="text" class="form-control-custom" id="cc-id-UPwePut0Sstz" name="phoneNumber" inputmode="tel"
            customval="" placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-yshA6P3MsHar">
          <label class="label-name" id="cc-id-AJOCBnD3XkfF">Full Address</label>
          <input type="text" class="form-control-custom" id="cc-id-NuYUPnmbpD0e" name="address1" customval=""
            placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-zNmREpOaUVgA">
          <label class="label-name" id="cc-id-k7Gdp0CXP9K6">Address Line 2</label>
          <input type="text" class="form-control-custom" id="cc-id-3LSFZH3UDqpN" name="address2" customval=""
            placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-VGMrerqtHioR">
          <label class="label-name" id="cc-id-RdzHzmA4KR1V">City</label>
          <input type="text" class="form-control-custom" id="cc-id-QW2r8Tn5uJmZ" name="city" customval=""
            placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-fB4hK9pLxYqR">
          <label class="label-name" id="cc-id-mT7vX2gN6sWc">State/Province</label>
          <select name="state" class="form-control-custom fk-form-select cc-form-control-custom" type="select"
            id="cc-id-hD8jQ3rV5nLp" customval="">
            <option value="">Select State</option>
          </select>
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-wR6yK1sM4tXo">
          <label class="label-name" id="cc-id-eN9zP2vC7bAq">Zip Code</label>
          <input type="text" class="form-control-custom" id="cc-id-uF3gT8mW1kSj" name="postalCode" customval=""
            placeholder="" />
        </div>
        <div class="form-group-div fk-element-container" id="cc-id-oL5cX9dR2yBn">
          <label class="label-name" id="cc-id-iV4hZ6qK8pMt">Country</label>
          <select onchange="changeCountry()" name="country" required=""
            class="form-control-custom fk-form-select cc-form-control-custom" type="select" id="cc-id-aG7nJ2wE5tYs"
            customval="">
            <option value="">Choose Country *</option>
          </select>
        </div>
      </div>
      <div class="fk-element-container" id="cc-id-sD1kL4vN9qXm">
        <button class="btn btn-primary cc-form-btn" style="margin-left: auto; margin-right: auto;" title=""
          align="center" btntype="none" type="button" onclick="callMethod(event)" action="submit" size="none"
          id="cc-id-bY6rP3mT8jKw">
          Submit
        </button>
      </div>
    </form>
  </div>

</body>
</html>
