    body {

      background-color: #fbfbfb;
      margin: 0;
    }

    .cc-hero-section {

      padding: 60px 20px 90px 20px;
      text-align: center;
      color: #fff;
    }

    .cc-hero-section h1 {

      font-weight: 700;
      font-size: 2.4rem;
      margin-bottom: 15px;
    }

    .cc-hero-section p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
      opacity: 0.95;
    }

    .cc-form-wrapper {
      max-width: 800px;
      margin: -50px auto 60px auto;
      padding: 0 15px;
    }

    .cc-form-card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

    /* ---- Lead - with label component styles (unmodified) ---- */
    .form-style {

      border: 1px solid #f4f4f4;
    }

      font-weight: 400;
      text-align: center;
      white-space: normal;
      vertical-align: middle;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      border: 1px solid transparent;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 25px;
      padding-right: 25px;
      line-height: 1.5;
      border-radius: 0.25rem;
      transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out,
        border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      margin: 20px auto;
      white-space: normal;
      font-size: 20px;
    }

    .btn-primary {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
      white-space: normal;
    }

    .form-control-custom {
      display: block;
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      line-height: 1.5;
      color: #495057;
      background-color: #fff;
      background-clip: padding-box;
      border: 1px solid #ced4da;
      border-radius: 0.25rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .form-group-div {
      margin: 10px 0px;
      width: 100%;
      padding: 0px 15px;
    }

    .text-center {
      text-align: center;
    }

    .row-wrap {
      display: flex;
      flex-wrap: wrap;
      width: auto;
    }

    .cc-v2 {
      border-radius: 6px;
      background: #f4f4f4ff;
      padding: 20px 10px 10px 10px;
      font-family: Poppins;
      font-weight: 400;
    }

    .cc-v2 label {
      font-family: Poppins;
      font-weight: 400;
      width: fit-content;
    }

    .cc-form-control-custom {
      font-family: poppins;
      font-weight: 400;
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(73, 80, 87, 1);
      background-color: rgba(255, 255, 255, 1);
      background-clip: padding-box;
      border: 1px solid rgba(206, 212, 218, 1);
      border-radius: 0.25rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .cc-v2 .btn.btn-primary.cc-form-btn {
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 25px;
      padding-right: 25px;
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: 20px;
      background: #f26419ff;
      border-color: #f26419ff;
    }

    .cc-v2 .btn.btn-primary.cc-form-btn:hover {
      background: #f26419ff;
      border-color: #f26419ff;
    }

      align-items: center;
      font-family: Poppins;
      font-weight: 400;
    }

      text-align: left;
      width: 49%;
      padding: 0px;

      font-family: montserrat;

      border-radius: 6px;
      outline: none !important;
      box-shadow: none;
    }

    @media screen and (max-width: 576px) {
      .cc-container div {
        width: 100%;

    .quantity-circle {

      margin-top: 1%;
      position: absolute;
      top: unset;
      border-radius: 50%;

      height: 30px;
      padding: 8px;
      border: 2px solid #666;
      color: #666;
      text-align: center;
      font: 10px Arial, sans-serif;
      right: unset;

    .image-quantity-container {
      margin: 0 auto;
      width: 100px;
      height: auto;
      position: relative;
    }

    .image-cart-header {

      height: 56px;
      float: left;
      margin-left: 10%;
      max-height: 100px;
    }

    .rightPanelHTML {
      display: none;

      float: right;
      margin-right: 10%;

    .panelCartCircle {
      position: absolute;
      margin: 0%;
      margin-left: -6px;
      top: unset;
      right: unset;
    }

    .fk-shopping-cart-icon {
      font-size: 32px;
      margin-top: 15px;
      cursor: pointer;
    }

    .cartPanelHeader {
      padding: 0.5rem;
      min-height: 80px;
      background-color: #fff;
      overflow: visible;
    }

    .fk-inner-header-wrapper {
      display: flex;
      flex-direction: row;
      margin: 0 10%;
      justify-content: space-between;
    }

    .fk-brand-wrapper {
      display: flex;
      flex-direction: row;
    }

    .fk-brand,
    .fk-cart-icon-container {
      margin: 0;
    }

    .fk-menu-container {
      padding: 5px;
      display: flex;
      flex-direction: row;
      align-self: center;
      flex-wrap: wrap;
      margin-right: auto;
    }

    .fk-inner-header-wrapper .fk-menu-container .fk-menu {
      padding: 5px;
      white-space: nowrap;
      color: black;
    }

    .fk-inner-header-wrapper .fk-menu-container .fk-menu:hover,
    .fk-inner-header-wrapper .fk-menu-container .fk-menu:focus {
      color: black;
    }

    .fk-menu-btn-container {
      display: none;
      padding: 5px;
    }

    .fk-menu-btn {
      background-color: transparent;
      border: none;
      cursor: pointer;
      color: black;
      font-size: 25px;
      padding: 5px 8px;
    }

    .fk-menu-btn,
    .fk-menu-btn:focus {
      outline: none;
    }

    .fk-cart-container {
      padding: 5px;
      position: relative;
    }

    .fk-cart-wrapper {
      display: flex;
      flex-direction: row;
      padding: 5px;
    }

    .sidepanel .cc-panel-view-cart,
    .sidepanel .cc-panel-checkout {
      font-size: 16px;
      padding: 5px 0;
      margin: 0px auto;
    }

    @media (max-width: 480px) {

        width: 55px;
        position: relative;
      }
      .image-cart-header {
        margin-left: 5%;
        width: 150px;
        height: 28px;
        margin-top: 3%;

      .quantity-circle {
        position: absolute;
        top: unset;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        padding: 5px;
        border: 2px solid #666;
        color: #666;
        text-align: center;
        font: 8px Arial, sans-serif;
        right: unset;
      }
    }

    @media (max-width: 768px) {
      .fk-menu-btn-container {
        display: flex;
        align-self: center;
      }
      .fk-menu-container {
        display: none;
      }
      .cartPanelHeader {
        height: 70px;
      }
      .fk-shopping-cart-icon {
        font-size: 25px;
      }
      .fk-inner-header-wrapper {
        margin-left: 3%;
        margin-right: 8%;
      }
    }

    @media (max-width: 480px) {
      .fk-shopping-cart-icon {
        font-size: 20px;
      }
      .cartPanelHeader {
        height: 60px;
      }
      .panelCartCircle {
        position: absolute;
        margin: 0%;
        margin-left: -6px;
        top: unset;
        right: unset;
      }
    }
