  <style id="cc-id-q3R4s5T6u7V8">
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #212529;
    }

    /* ===== Header component styles ===== */
    .quantity-circle {
      margin-right: 9%;
      margin-top: 1%;
      position: absolute;
      top: unset;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      padding: 8px;
      border: 2px solid #666;
      color: #666;
      text-align: center;
      font: 10px Arial, sans-serif;
      right: unset;
    }

    .image-quantity-container {
      margin: 0 auto;
      width: 100px;
      height: auto;
      position: relative;
    }

    .image-cart-header {
      width: 300px;
      height: 56px;
      float: left;
      margin-left: 10%;
      max-height: 100px;
    }

    .cc-cv-canvas__tools > #cc-tools > .cc-toolbar > div > .fa-trash-o {
      pointer-events: none;
    }

    .rightPanelHTML {
      display: none;
    }

    .fk-parent-cart-element {
      display: inline-block;
      float: right;
      margin-right: 10%;
    }

    .panelCartCircle {
      position: absolute;
      margin: 0%;
      margin-left: -6px;
      top: unset;
      right: unset;
    }

    .fk-shopping-cart-icon {
      font-size: 32px;
      margin-top: 15px;
      cursor: pointer;
    }

    .cartPanelHeader {
      padding: 0.5rem;
      min-height: 80px;
      background-color: #fff;
      overflow: visible;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .fk-inner-header-wrapper {
      display: flex;
      flex-direction: row;
      margin: 0 10%;
      justify-content: space-between;
    }

    .fk-brand-wrapper {
      display: flex;
      flex-direction: row;
    }

    .fk-brand,
    .fk-cart-icon-container {
      margin: 0;
    }

    .fk-menu-container {
      padding: 5px;
      display: flex;
      flex-direction: row;
      align-self: center;
      flex-wrap: wrap;
      margin-right: auto;
    }

    .fk-inner-header-wrapper .fk-menu-container .fk-menu {
      padding: 5px;
      white-space: nowrap;
      color: black;
    }

    .fk-inner-header-wrapper .fk-menu-container .fk-menu:hover,
    .fk-inner-header-wrapper .fk-menu-container .fk-menu:focus {
      color: black;
    }

    .fk-menu-btn-container {
      display: none;
      padding: 5px;
    }

    .fk-menu-btn {
      background-color: transparent;
      border: none;
      cursor: pointer;
      color: black;
      font-size: 25px;
      padding: 5px 8px;
    }

    .fk-menu-btn,
    .fk-menu-btn:focus {
      outline: none;
    }

    .fk-cart-container {
      padding: 5px;
      position: relative;
    }

    .fk-cart-wrapper {
      display: flex;
      flex-direction: row;
      padding: 5px;
    }

    .sidepanel .cc-panel-view-cart,
    .sidepanel .cc-panel-checkout {
      font-size: 16px;
      padding: 5px 0;
      margin: 0px auto;
    }

    @media (max-width: 480px) {
      .image-quantity-container {
        margin: 0 auto;
        width: 55px;
        position: relative;
      }
      .image-cart-header {
        margin-left: 5%;
        width: 150px;
        height: 28px;
        margin-top: 3%;
      }
      .quantity-circle {
        position: absolute;
        top: unset;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        padding: 5px;
        border: 2px solid #666;
        color: #666;
        text-align: center;
        font: 8px Arial, sans-serif;
        right: unset;
      }
    }

    @media (max-width: 768px) {
      .fk-menu-btn-container {
        display: flex;
        align-self: center;
      }
      .fk-menu-container {
        display: none;
      }
      .cartPanelHeader {
        height: 70px;
      }
      .fk-shopping-cart-icon {
        font-size: 25px;
      }
      .fk-inner-header-wrapper {
        margin-left: 3%;
        margin-right: 8%;
      }
    }

    @media (max-width: 480px) {
      .fk-shopping-cart-icon {
        font-size: 20px;
      }
      .cartPanelHeader {
        height: 60px;
      }
      .panelCartCircle {
        position: absolute;
        margin: 0%;
        margin-left: -6px;
        top: unset;
        right: unset;
      }
    }

    /* ===== Collection page heading ===== */
    .cc-collection-heading-wrapper {
      padding: 48px 20px 24px;
      background-color: #f8f9fa;
    }

    .cc-collection-headline {
      font-weight: 700;
      font-size: 2.25rem;
      margin-bottom: 8px;
    }

    .cc-collection-subtext {
      color: #6c757d;
      font-size: 1.05rem;
    }

    .cc-collection-main {
      min-height: 60vh;
    }

    /* ===== Multi Collection component styles ===== */
    .fk-product-row {
      margin: 10px 18%;
      padding: 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
    }

    .fk-product-col {
      padding: 10px;
      width: 25%;
      display: flex;
      flex: 0 0 auto;
      width: 25%;
    }

    .fk-product-col-dynamic {
      flex: 0 0 auto;
      width: 25%;
    }

    .fk-product-card-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .fk-product-card-image:hover {
      transform: scale(1.1);
    }

    .fk-product-card-image-container {
      overflow: hidden;
      width: 100%;
      height: 150px;
    }

    .fk-product-card {
      border: 1px solid #80808047;
      border-radius: 10px;
      width: 100%;
    }

    .fk-product-body {
      padding: 10px;
      text-align: center;
    }

    .fk-product-price span {
      font-size: 18px;
    }

    .fk-product-actual-price {
      text-decoration: line-through red;
      word-break: break-word;
    }

    .fk-product-offer-price {
      color: green;
      font-weight: 700;
      word-break: break-word;
    }

    .fk-product-name,
    .fk-product-headline {
      font-size: 18px;
      font-weight: 400;
      word-break: break-word;
    }

    .cc-align-center-box {
      display: flex;
      flex-direction: column;
    }

    .cc-align-center-box .btn-outline-primary {
      border-color: #007bff !important;
    }

    .cc-multi-collection-menu {
      width: 100%;
      height: 50px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .cc-menu-item {
      margin: 10px;
      padding: 10px;
    }

    #productRow-1 {
      flex: none;
    }

    @media (max-width: 991.98px) {
      .fk-product-col,
      .fk-product-col-dynamic {
        width: 33.3333%;
      }
    }

    @media (max-width: 767.98px) {
      .fk-product-col,
      .fk-product-col-dynamic {
        width: 50%;
      }
    }

    @media (max-width: 480px) {
      .fk-product-col,
      .fk-product-col-dynamic {
        width: 100%;
      }
    }

    /* ===== Footer ===== */
    .cc-collection-footer {
      padding: 24px 20px;
      background-color: #212529;
      color: #f8f9fa;
    }

    .cc-footer-text {
      margin: 0;
      font-size: 0.9rem;
    }
  </style>
</head>
